# Builds the Slime Sumo server image and pushes it to the Edgegap Container Registry.
# Tag = UTC time (YYYYMMDD-HHMM), also used as the Edgegap app version name.
# From the edgegap-threejs skill (assets/ci/server-image.yml).
#
# Repository settings (set by the repo owner, never committed):
#   secrets   EDGEGAP_REGISTRY_USERNAME, EDGEGAP_REGISTRY_TOKEN  (Edgegap dashboard > Container Registry)
#   variables EDGEGAP_REGISTRY_PROJECT                           (the <project> in registry.edgegap.com/<project>/...)
name: Server image

on:
  push:
    branches: [main]
    paths: [server/**, src/rules.js, Dockerfile, .dockerignore, .github/workflows/server-image.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: slime-sumo-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Container test (random external port, WebSocket hello)
        run: |
          docker build --platform linux/amd64 -t slime-sumo-test .
          docker run -d --name sumo -p 31504:7777 -e WAIT_SECONDS=2 -e COUNTDOWN_SECONDS=1 slime-sumo-test
          npm ci --ignore-scripts --no-audit --no-fund
          sleep 3
          node tools/e2e-container.mjs ws://127.0.0.1:31504
          docker rm -f sumo
      - uses: docker/login-action@v3
        with:
          registry: registry.edgegap.com
          username: ${{ secrets.EDGEGAP_REGISTRY_USERNAME }}
          password: ${{ secrets.EDGEGAP_REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # A plain single-platform manifest: no provenance/SBOM attestations, which wrap the
          # image in an index that the Edgegap deployer can't pull.
          provenance: false
          sbom: false
          tags: registry.edgegap.com/${{ vars.EDGEGAP_REGISTRY_PROJECT }}/${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
      - name: Summary
        run: echo "Pushed registry.edgegap.com/${{ vars.EDGEGAP_REGISTRY_PROJECT }}/${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
